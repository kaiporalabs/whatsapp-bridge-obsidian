name: Release attested assets
on:
  push:
    tags:
      - '[0-9]*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: node -e 'if (require("./manifest.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: npm ci
      - run: npm run package
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --verify-tag --title "WhatsApp Bridge $RELEASE_TAG" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: manual-installation
          path: dist/*.zip
